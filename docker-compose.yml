version: "3.9"

services:
  # 1. Backend Service (Node.js)
  backend:
    image: abhichoudhary2077/pulseops-backend:latest
    container_name: pulseops-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

  # 2. Frontend Service (Nginx + React/Vite)
  frontend:
    image: abhichoudhary2077/pulseops-frontend:latest
    container_name: pulseops-frontend
    restart: always
    ports:
      - "80:80"  # This maps EC2 Port 80 to Docker Port 80
    depends_on:
      - backend