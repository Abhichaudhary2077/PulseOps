services:
  backend:
    image: abhichoudhary2077/pulseops-backend:latest
    container_name: pulseops-backend
    restart: unless-stopped

  frontend:
    image: abhichoudhary2077/pulseops-frontend:latest
    container_name: pulseops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
