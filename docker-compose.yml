version: "3.9"

services:
  backend:
    image: abhicdhaudary2077/pulseops-backend:latest
    container_name: pulseops-backend
    restart: unless-stopped
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: pulseops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
