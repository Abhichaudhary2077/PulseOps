name: PulseOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend API
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-deploy:
    name: Build images and deploy to OCI
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pulseops-production
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          echo "version=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.metadata.outputs.build_timestamp }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pulseops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pulseops-backend:${{ github.sha }}
          cache-from: type=gha,scope=pulseops-backend
          cache-to: type=gha,scope=pulseops-backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pulseops-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pulseops-frontend:${{ github.sha }}
          cache-from: type=gha,scope=pulseops-frontend
          cache-to: type=gha,scope=pulseops-frontend,mode=max

      - name: Deploy with smoke test and rollback
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            : "${IMAGE_TAG:?IMAGE_TAG was not supplied}"
            : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME was not supplied}"

            cd ~/pulseops
            ROLLBACK_TAG="rollback"
            ROLLBACK_AVAILABLE=false

            write_env() {
              printf 'IMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\n' "$1" "$DOCKERHUB_USERNAME" > .env.tmp
              chmod 600 .env.tmp
              mv .env.tmp .env
            }

            if docker inspect pulseops-backend >/dev/null 2>&1 && docker inspect pulseops-frontend >/dev/null 2>&1; then
              BACKEND_IMAGE_ID="$(docker inspect --format='{{.Image}}' pulseops-backend)"
              FRONTEND_IMAGE_ID="$(docker inspect --format='{{.Image}}' pulseops-frontend)"
              docker image tag "$BACKEND_IMAGE_ID" "$DOCKERHUB_USERNAME/pulseops-backend:$ROLLBACK_TAG"
              docker image tag "$FRONTEND_IMAGE_ID" "$DOCKERHUB_USERNAME/pulseops-frontend:$ROLLBACK_TAG"
              ROLLBACK_AVAILABLE=true
            fi

            rollback_on_failure() {
              EXIT_CODE=$?
              if [ "$EXIT_CODE" -ne 0 ] && [ "$ROLLBACK_AVAILABLE" = "true" ]; then
                echo "Deployment failed; restoring the previously running images."
                write_env "$ROLLBACK_TAG"
                docker compose up -d --remove-orphans || true
                docker compose ps || true
              fi
            }
            trap rollback_on_failure EXIT

            echo "=== MEMORY BEFORE DEPLOY ==="
            free -h

            write_env "$IMAGE_TAG"
            docker compose config --quiet

            echo "=== PULL COMMIT-PINNED IMAGES ==="
            timeout 180s docker compose pull

            echo "=== START SERVICES ==="
            timeout 90s docker compose up -d --remove-orphans

            echo "=== POST-DEPLOYMENT SMOKE TEST ==="
            HEALTH_JSON=""
            for attempt in $(seq 1 12); do
              if HEALTH_JSON="$(docker compose exec -T frontend wget -q -O- http://127.0.0.1/api/health 2>/dev/null)"; then
                break
              fi
              sleep 5
            done

            if [ -z "$HEALTH_JSON" ]; then
              echo "Health endpoint did not respond through NGINX."
              docker compose logs --tail=100
              exit 1
            fi
            printf 'Health response: %s\n' "$HEALTH_JSON"

            VERSION_JSON="$(docker compose exec -T frontend wget -q -O- http://127.0.0.1/api/version)"
            SYSTEM_JSON="$(docker compose exec -T frontend wget -q -O- http://127.0.0.1/api/system)"

            printf '%s' "$VERSION_JSON" | grep -Fq "\"gitCommit\":\"$IMAGE_TAG\"" || {
              echo "Version endpoint is not reporting the deployed commit."
              exit 1
            }
            printf '%s' "$VERSION_JSON" | grep -Eq '"buildTimestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T' || {
              echo "Version endpoint is missing valid build metadata."
              exit 1
            }
            printf '%s' "$SYSTEM_JSON" | grep -q '"vmUptimeSeconds":' || {
              echo "System metrics endpoint did not return the expected payload."
              exit 1
            }

            echo "=== DEPLOYMENT VERIFIED ==="
            docker compose ps
            echo "=== MEMORY AFTER DEPLOY ==="
            free -h

            trap - EXIT
            docker image prune -f
