name: PulseOps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build -t abhichoudhary2077/pulseops-backend:latest ./backend
          docker push abhichoudhary2077/pulseops-backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -t abhichoudhary2077/pulseops-frontend:latest ./frontend
          docker push abhichoudhary2077/pulseops-frontend:latest

              - - name: Deploy on EC2
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
              cd ~
              docker compose pull
              docker compose up -d
