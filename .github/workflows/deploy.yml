name: PulseOps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push BOTH images
      - name: Build and push Docker images
        run: |
          # Backend build
          docker build -t abhichoudhary2077/pulseops-backend:latest ./backend
          docker push abhichoudhary2077/pulseops-backend:latest
          
          # Frontend build
          docker build -t abhichoudhary2077/pulseops-frontend:latest ./frontend
          docker push abhichoudhary2077/pulseops-frontend:latest

      # Copy docker-compose.yml to EC2
      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ec2-user/"

      # Deploy via SSH
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user
            # Login to Docker Hub on EC2 (Required if repo is private)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Pull the latest versions of both images
            docker compose pull
            
            # Re-start containers with the new images
            docker compose up -d
            
            # Clean up old/unused images to save EC2 disk space
            docker image prune -f